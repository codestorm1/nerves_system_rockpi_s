#
# Firmware metadata
#
# The pre-partition-table Rockchip blob offsets (idbloader@32K,
# uboot.img@8M, trust.img@12M) are the boot-ROM-mandated ones from
# buildroot.rockchip.ext/board/RK3308/genimage.cfg -- hard constraints,
# verified-working. The U-Boot environment and A/B layout were modeled after
# nerves_system_radxa_cm3 (RK3566), adapted for RK3308, and verified on real
# hardware with complete-image, A-to-B, and B-to-A updates.
#
# The FAT boot partition stores separate kernel and device-tree files for the
# A and B slots. U-Boot selects the files matching nerves_fw_active, while an
# upgrade replaces only the inactive slot's boot files and squashfs before it
# switches the environment. This keeps kernel/DTB rollback aligned with the
# root filesystem without consuming another MBR partition.
#

define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "rockpi_s")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "")

define(NERVES_FW_DEVPATH, "/dev/mmcblk2")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mmcblk2p4") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "ext4")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Layout (all offsets/counts in 512-byte blocks):
#
# +-------------------------------------+
# | idbloader.img   (offset 64,    32K) | <- DDR init + miniloader, boot-ROM fixed
# | uboot.img       (offset 16384,  8M) | <- U-Boot proper, boot-ROM fixed
# | trust.img       (offset 24576, 12M) | <- ATF bl31, boot-ROM fixed
# | U-Boot env      (offset 30720, 15M) | <- Nerves a/b slot metadata
# +-------------------------------------+
# | p1: A/B boot files (FAT32)          | <- Image.{a,b}, DTB.{a,b}, boot.scr
# +-------------------------------------+
# | p2: rootfs A (squashfs)             |
# +-------------------------------------+
# | p3: rootfs B (squashfs)             |
# +-------------------------------------+
# | p4: application data (ext4)         |
# +-------------------------------------+

define(IDBLOADER_OFFSET, 64)
define(UBOOT_OFFSET, 16384)
define(TRUST_OFFSET, 24576)

# Reserved raw Nerves metadata environment. The initial working U-Boot uses
# ENV_IS_NOWHERE and boots via boot.scr; persistent A/B boot state is follow-up.
define(UBOOT_ENV_OFFSET, 30720) # 15 MiB
define(UBOOT_ENV_COUNT, 64) # 32 KiB (fixed U-Boot default)

define(BOOT_PART_OFFSET, 32768) # 16 MiB
define(BOOT_PART_COUNT, 65536) # 32 MiB FAT boot partition

define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}") # 48 MiB
define(ROOTFS_A_PART_COUNT, 716800) # 350 MiB
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application partition. This partition can occupy all of the remaining
# space; the default count below only matters when not expanded to fit
# the destination media.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576) # 512 MiB

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
